name: Scrape & Deploy

on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

# contents: write is needed by the keepalive step below
permissions:
  contents: write

jobs:
  scrape-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub disables cron schedules after 60 days without a commit.
      # When the last commit is ~50 days old, push an empty one to reset
      # the clock so the half-hourly scrape never silently stops.
      - name: Keep scheduled workflow alive
        if: github.event_name == 'schedule'
        run: |
          AGE_DAYS=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          if [ "$AGE_DAYS" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive commit so the scheduled scrape stays enabled"
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Retried because native-module builds (better-sqlite3) download Node
      # headers from nodejs.org, which occasionally drops connections.
      - name: Install dependencies
        run: npm ci || (sleep 30 && npm ci) || (sleep 60 && npm ci)

      - name: Ensure data directory
        run: mkdir -p data

      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: |
            data/aewaittime.db
            data/aewaittime.db-wal
            data/aewaittime.db-shm
          key: db-${{ github.run_id }}
          restore-keys: db-

      - name: Run scrapers
        run: npx tsx scripts/scrape.ts

      - name: Save database
        uses: actions/cache/save@v4
        with:
          path: |
            data/aewaittime.db
            data/aewaittime.db-wal
            data/aewaittime.db-shm
          key: db-${{ github.run_id }}

      - name: Build static site
        run: npm run build

      # The hosting account has shell access disabled, so deployment is
      # pure SFTP/scp — no remote commands. scp on the Ubuntu runner uses
      # the SFTP protocol by default, which this account permits.
      - name: Setup SSH key
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
        run: |
          set -euo pipefail
          SSH_PORT="${CPANEL_SSH_PORT:-2239}"

          mkdir -p ~/.ssh
          printf '%s\n' "$CPANEL_SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # ssh-keyscan occasionally times out reaching the cPanel host from
          # the runner (~1% of runs). Retry with backoff so a transient blip
          # doesn't fail the whole scrape+deploy — the scrape is already done
          # and cached by this point, so only the deploy would be lost.
          scanned=0
          for attempt in 1 2 3 4; do
            if ssh-keyscan -T 20 -p "$SSH_PORT" -H "$CPANEL_HOST" > ~/.ssh/known_hosts.tmp 2>/dev/null && [ -s ~/.ssh/known_hosts.tmp ]; then
              mv ~/.ssh/known_hosts.tmp ~/.ssh/known_hosts
              scanned=1
              break
            fi
            echo "ssh-keyscan attempt $attempt failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          if [ "$scanned" != 1 ]; then
            echo "ssh-keyscan could not reach $CPANEL_HOST:$SSH_PORT after 4 attempts" >&2
            exit 1
          fi

      # Install lftp for parallel SFTP upload. A plain `scp -r` opens a
      # fresh round-trip per file, so uploading ~1,200 small static-export
      # files serially takes ~5 min even though the payload is only ~35 MB.
      # lftp mirrors with many concurrent transfers, cutting it to ~1 min.
      - name: Install lftp
        run: command -v lftp >/dev/null || sudo apt-get install -y --no-install-recommends lftp

      - name: Deploy to cPanel
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          CPANEL_TARGET_DIR: ${{ secrets.CPANEL_TARGET_DIR }}
        run: |
          set -euo pipefail
          SSH_PORT="${CPANEL_SSH_PORT:-2239}"
          TARGET="${CPANEL_TARGET_DIR}"

          # Key auth over SFTP via a custom connect-program; known_hosts was
          # populated by the "Setup SSH key" step above.
          SSH_CMD="ssh -a -x -p $SSH_PORT -i $HOME/.ssh/id_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 -o UserKnownHostsFile=$HOME/.ssh/known_hosts"

          # mirror -R uploads local -> remote. No --delete, so this matches the
          # old scp behaviour (overwrite/add, never remove remote files). lftp
          # re-uploads a file only when it's missing or differs, and always
          # errs toward uploading, so it never leaves stale content.
          lftp -u "$CPANEL_USER," "sftp://$CPANEL_HOST" <<LFTP
          set sftp:connect-program "$SSH_CMD"
          set sftp:auto-confirm yes
          set cmd:fail-exit yes
          set net:timeout 20
          set net:max-retries 3
          set net:reconnect-interval-base 5
          set mirror:parallel-transfer-count 10
          set mirror:use-pget-n 1
          mirror -R --verbose out/ "$TARGET/"
          bye
          LFTP
